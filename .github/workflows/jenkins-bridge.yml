name: Trigger Jenkins OpenCodeReview

on:
  pull_request_target:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-jenkins:
    name: Forward PR review event to Jenkins

    # 新建/重开 PR 自动触发；评论仍限授权人员新发的审查命令。
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        github.event.comment.user.type != 'Bot' &&
        github.event.comment.body == '/open-code-review' &&
        (
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'
        )
      )

    runs-on: [self-hosted, linux, x64, jenkins-bridge]
    timeout-minutes: 5

    steps:
      # 不检出或执行 PR 代码，仅校验并转发事件。
      - name: Validate PR and forward event
        uses: actions/github-script@v7

        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
          JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}

        with:
          script: |
            const fs = require('fs');

            const url = process.env.JENKINS_WEBHOOK_URL;
            const token = process.env.JENKINS_WEBHOOK_TOKEN;

            if (!url || !token) {
              throw new Error(
                'Missing JENKINS_WEBHOOK_URL or JENKINS_WEBHOOK_TOKEN.'
              );
            }

            // PR 事件与评论事件使用不同的编号字段。
            const prNumber = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : context.issue.number;

            // 从 GitHub 获取最新 PR 状态。
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            if (pr.state !== 'open') {
              core.notice('PR is closed; review request skipped.');
              return;
            }

            // 当前方案只接入同仓库 PR，不接入 fork PR。
            const repository = `${context.repo.owner}/${context.repo.repo}`;

            if (
              !pr.head.repo ||
              pr.head.repo.full_name !== repository
            ) {
              throw new Error(
                'Fork PRs are not enabled for this review pipeline.'
              );
            }

            // 转发完整事件 JSON，保留 opened/reopened/created action。
            const payload = fs.readFileSync(
              process.env.GITHUB_EVENT_PATH,
              'utf8'
            );

            const response = await fetch(url, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              headers: {
                'Content-Type': 'application/json',
                'X-GitHub-Event': context.eventName === 'pull_request_target'
                  ? 'pull_request' : 'issue_comment',
                'token': token,
              },
              body: payload,
            });

            if (!response.ok) {
              throw new Error(
                `Jenkins webhook returned HTTP ${response.status}.`
              );
            }

            const result = await response.json();

            const triggered = Object.values(result.jobs || {})
              .some(job => job.triggered === true);

            if (!triggered) {
              throw new Error(
                'Jenkins received the event, but no trigger job was queued. ' +
                'Check the plugin Token, JSONPath variables and filter.'
              );
            }

            core.info(
              `Jenkins dispatcher queued for ${repository} PR #${pr.number} (${context.eventName}/${context.payload.action}).`
            );
