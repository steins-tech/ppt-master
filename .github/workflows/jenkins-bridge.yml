name: Trigger Jenkins OpenCodeReview

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  trigger-jenkins:
    name: Forward PR review command to Jenkins

    # 仅处理授权人员在 PR 中新发的审查命令。
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.body == '/open-code-review' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )

    runs-on: [self-hosted, linux, x64, jenkins-bridge]
    timeout-minutes: 5

    steps:
      - name: Validate PR and forward comment event
        uses: actions/github-script@v7

        env:
          JENKINS_WEBHOOK_URL: ${{ secrets.JENKINS_WEBHOOK_URL }}
          JENKINS_WEBHOOK_TOKEN: ${{ secrets.JENKINS_WEBHOOK_TOKEN }}

        with:
          script: |
            const fs = require('fs');

            const url = process.env.JENKINS_WEBHOOK_URL;
            const token = process.env.JENKINS_WEBHOOK_TOKEN;

            if (!url || !token) {
              throw new Error(
                'Missing JENKINS_WEBHOOK_URL or JENKINS_WEBHOOK_TOKEN.'
              );
            }

            // 从 GitHub 获取最新 PR 状态。
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            if (pr.state !== 'open') {
              core.notice('PR is closed; review request skipped.');
              return;
            }

            // 当前方案只接入同仓库 PR，不接入 fork PR。
            const repository = `${context.repo.owner}/${context.repo.repo}`;

            if (
              !pr.head.repo ||
              pr.head.repo.full_name !== repository
            ) {
              throw new Error(
                'Fork PRs are not enabled for this review pipeline.'
              );
            }

            // 转发完整事件 JSON，供 Jenkins 的 JSONPath 配置提取。
            const payload = fs.readFileSync(
              process.env.GITHUB_EVENT_PATH,
              'utf8'
            );

            const response = await fetch(url, {
              method: 'POST',
              redirect: 'error',
              signal: AbortSignal.timeout(30000),
              headers: {
                'Content-Type': 'application/json',
                'X-GitHub-Event': 'issue_comment',
                'token': token,
              },
              body: payload,
            });

            if (!response.ok) {
              throw new Error(
                `Jenkins webhook returned HTTP ${response.status}.`
              );
            }

            const result = await response.json();

            const triggered = Object.values(result.jobs || {})
              .some(job => job.triggered === true);

            if (!triggered) {
              throw new Error(
                'Jenkins received the event, but no trigger job was queued. ' +
                'Check the plugin Token, JSONPath variables and filter.'
              );
            }

            core.info(
              `Jenkins comment dispatcher queued for ${repository} PR #${pr.number}.`
            );